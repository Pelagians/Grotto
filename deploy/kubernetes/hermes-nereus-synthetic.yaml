# Reference only: replace every REPLACE_* value before applying.
# Run in the dedicated qualification namespace, with a reviewed encrypted
# StorageClass and immutable, CI-qualified Grotto Hermes image digest.
apiVersion: v1
kind: ConfigMap
metadata:
  name: hermes-nereus-synthetic-config
  namespace: pelagian-agent-app-qualification
data:
  config.yaml: |
    # Dedicated synthetic profile; keep terminal and file tools unavailable.
    _config_version: 39
    model:
      default: REPLACE_MODEL_ID
      provider: custom:qualification
    providers:
      qualification:
        base_url: https://REPLACE_MODEL_PROVIDER_ORIGIN/v1
        key_env: PELAGIAN_MODEL_API_KEY
        model: REPLACE_MODEL_ID
    agent:
      run_budget_seconds: 180
      max_turns: 8
    platform_toolsets:
      cli: [todo]
    mcp_servers:
      pelagian_nereus:
        command: /opt/hermes/.venv/bin/python
        args: [/usr/local/libexec/pelagian-nereus-mcp.py]
        enabled: true
        env:
          PELAGIAN_TENANT_ID: "${PELAGIAN_TENANT_ID}"
          PELAGIAN_NEREUS_URL: "${PELAGIAN_NEREUS_URL}"
          PELAGIAN_OAUTH_TOKEN_URL: "${PELAGIAN_OAUTH_TOKEN_URL}"
          PELAGIAN_OAUTH_CLIENT_ID: "${PELAGIAN_OAUTH_CLIENT_ID}"
          PELAGIAN_OAUTH_CLIENT_SECRET_FILE: "${PELAGIAN_OAUTH_CLIENT_SECRET_FILE}"
          PELAGIAN_OAUTH_AUDIENCE: "${PELAGIAN_OAUTH_AUDIENCE}"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: hermes-nereus-synthetic-data
  namespace: pelagian-agent-app-qualification
  labels: {app: hermes-nereus-synthetic}
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: REPLACE_ENCRYPTED_STORAGE_CLASS
  resources:
    requests: {storage: 8Gi}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hermes-nereus-synthetic
  namespace: pelagian-agent-app-qualification
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: {app: hermes-nereus-synthetic}
  template:
    metadata:
      labels: {app: hermes-nereus-synthetic}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10000
        runAsGroup: 10000
        fsGroup: 10000
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: hermes
          image: ghcr.io/pelagians/grotto-hermes@sha256:REPLACE_IMAGE_DIGEST
          imagePullPolicy: IfNotPresent
          # Qualification is an operator-driven, interactive CLI session.
          # The native s6 supervisor is not needed for this isolated pod.
          command: [/bin/sleep, infinity]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 100m, memory: 512Mi}
            limits: {cpu: "2", memory: 2Gi}
          env:
            - {name: PELAGIAN_TENANT_ID, value: REPLACE_TENANT_ID}
            - {name: PELAGIAN_NEREUS_URL, value: "https://REPLACE_NEREUS_TLS_ORIGIN"}
            - {name: PELAGIAN_OAUTH_TOKEN_URL, value: "https://REPLACE_IDENTITY_PROVIDER/token"}
            - {name: PELAGIAN_OAUTH_CLIENT_ID, value: REPLACE_CLIENT_ID}
            - {name: PELAGIAN_OAUTH_CLIENT_SECRET_FILE, value: /run/secrets/nereus/client-secret}
            - {name: PELAGIAN_OAUTH_AUDIENCE, value: REPLACE_NEREUS_AUDIENCE}
            - name: PELAGIAN_MODEL_API_KEY
              valueFrom:
                secretKeyRef:
                  name: REPLACE_MODEL_CREDENTIAL_SECRET
                  key: api-key
          volumeMounts:
            - {name: hermes-data, mountPath: /opt/data}
            - {name: hermes-config, mountPath: /opt/data/config.yaml, subPath: config.yaml, readOnly: true}
            - {name: hermes-workspace, mountPath: /workspace}
            - {name: hermes-tools, mountPath: /tools}
            - {name: hermes-homebrew, mountPath: /home/linuxbrew/.linuxbrew}
            - {name: hermes-cache, mountPath: /cache}
            - {name: tmp, mountPath: /tmp}
            - {name: nereus-client-secret, mountPath: /run/secrets/nereus, readOnly: true}
      volumes:
        - name: hermes-data
          persistentVolumeClaim: {claimName: hermes-nereus-synthetic-data}
        - name: hermes-config
          configMap:
            name: hermes-nereus-synthetic-config
            defaultMode: 0444
        - name: hermes-workspace
          emptyDir: {}
        - name: hermes-tools
          emptyDir: {}
        - name: hermes-homebrew
          emptyDir: {}
        - name: hermes-cache
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        - name: nereus-client-secret
          secret:
            secretName: REPLACE_CLIENT_CREDENTIAL_SECRET
            items:
              - {key: client-secret, path: client-secret}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: hermes-nereus-synthetic
  namespace: pelagian-agent-app-qualification
spec:
  podSelector:
    matchLabels: {app: hermes-nereus-synthetic}
  policyTypes: [Ingress, Egress]
  egress:
    # Reviewed TLS gateway for Nereus. The Helm Service itself is plain HTTP.
    - to:
        - ipBlock: {cidr: REPLACE_NEREUS_TLS_GATEWAY_CIDR}
      ports: [{protocol: TCP, port: 443}]
    # Cluster DNS.
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: kube-system}
          podSelector:
            matchLabels: {k8s-app: kube-dns}
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
    # Replace with narrow, reviewed egress ranges for the identity provider
    # and model provider. Use cluster FQDN egress policy if their IPs change.
    - to:
        - ipBlock: {cidr: REPLACE_IDENTITY_PROVIDER_CIDR}
        - ipBlock: {cidr: REPLACE_MODEL_PROVIDER_CIDR}
      ports: [{protocol: TCP, port: 443}]
