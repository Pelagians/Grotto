# Opt-in synthetic qualification profile. No provider/customer data.
# CLI built-ins are narrowed so the model cannot use terminal/file tools to
# read the mounted token or client-secret file. Do not enable other platforms.
_config_version: 39
platform_toolsets:
  cli: [todo]

# Opt-in only. Copy this MCP entry into the operator-owned Hermes config.yaml.
# Tenant, URLs, and credentials belong in deployment environment/secret files.
mcp_servers:
  pelagian_nereus:
    command: /opt/hermes/.venv/bin/python
    args:
      - /usr/local/libexec/pelagian-nereus-mcp.py
    enabled: true
    # Hermes filters inherited environment variables for MCP subprocesses.
    # These placeholders are resolved from the deployment environment and do
    # not place tokens or secrets in the model-editable config.
    env:
      PELAGIAN_TENANT_ID: "${PELAGIAN_TENANT_ID}"
      PELAGIAN_NEREUS_URL: "${PELAGIAN_NEREUS_URL}"
      PELAGIAN_LOCAL_TOKEN_FILE: "${PELAGIAN_LOCAL_TOKEN_FILE}"
