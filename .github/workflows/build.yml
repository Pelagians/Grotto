name: Build Grotto

on:
  schedule:
    # GitHub Actions cron is UTC.
    - cron: '17 11 * * *'

  push:
    branches:
      - main
    tags:
      - "v*"

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: build-grotto-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  checks:
    name: Static policy checks
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run repository checks
        run: make check

      - name: Run focused Python tests
        run: |
          python3 tests/test_grotto_doctor.py
          python3 tests/test_verify_installed_chatgpt_policy.py

      - name: Install ShellCheck
        if: github.event_name == 'pull_request'
        run: sudo apt-get update && sudo apt-get install --yes shellcheck

      - name: Shellcheck changed shell files
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          mapfile -t shell_files < <(
            git diff --name-only --diff-filter=ACMRT "$BASE_SHA...$HEAD_SHA" -- '*.sh'
          )
          if (( ${#shell_files[@]} > 0 )); then
            shellcheck "${shell_files[@]}"
          fi

      - name: Check diff whitespace
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: git diff --check "$BASE_SHA...$HEAD_SHA"

  image:
    name: Build ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: grotto-openclaw
            kind: agent
            image: ghcr.io/pelagians/grotto-openclaw
            title: Grotto OpenClaw
            description: General OpenClaw gateway with curated baseline tools and persistent user-installed toolchains
            file: ./Containerfile
          - name: grotto-hermes
            kind: agent
            image: ghcr.io/pelagians/grotto-hermes
            title: Grotto Hermes
            description: Official Hermes Agent with persistent Grotto tool environments
            file: ./Containerfile.hermes
          - name: grotto-chatgpt-desktop
            kind: desktop
            image: ghcr.io/pelagians/grotto-chatgpt-desktop
            title: Grotto ChatGPT Desktop
            description: Selkies-streamed ChatGPT and Codex desktop workbench
            file: ./Containerfile.chatgpt-desktop
            build_args: CHATGPT_PACKAGE_VERSION=26.820.60940
          - name: grotto-hermes-desktop
            kind: desktop
            image: ghcr.io/pelagians/grotto-hermes-desktop
            title: Grotto Hermes Desktop
            description: Official Hermes Desktop on the Pelagian Shell streamed workspace
            file: ./Containerfile.hermes-desktop
            build_args: |
              HERMES_DESKTOP_VERSION=v2026.8.27
              HERMES_DESKTOP_COMMIT=5fc308a70719a83cccdbba4c0e39c23f5a8239d5
          - name: grotto-openadapt-teach
            kind: worker
            image: ghcr.io/pelagians/grotto-openadapt-teach
            title: Grotto OpenAdapt Teach worker
            description: UI-only OpenAdapt recording and compilation worker for caller-owned browser runtimes
            file: ./Containerfile.openadapt-teach

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Reclaim runner disk space
        if: matrix.kind == 'desktop'
        shell: bash
        run: |
          set -euxo pipefail
          df -h /
          sudo rm -rf \
            /usr/local/lib/android \
            /usr/share/dotnet \
            /opt/ghc \
            /opt/hostedtoolcache/CodeQL
          sudo docker system prune --all --force --volumes || true
          available_kib="$(df --output=avail -k / | tail -n 1)"
          minimum_kib="$((15 * 1024 * 1024))"
          if (( available_kib < minimum_kib )); then
            echo "At least 15 GiB of free runner storage is required." >&2
            df -h /
            exit 1
          fi
          df -h /

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        env:
          DOCKER_METADATA_SHORT_SHA_LENGTH: 40
        with:
          images: ${{ matrix.image }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.title=${{ matrix.title }}
            org.opencontainers.image.description=${{ matrix.description }}
            org.opencontainers.image.source=https://github.com/pelagians/grotto

      - name: Build and publish agent image
        if: matrix.kind == 'agent'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GROTTO_BUILD_REVISION=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
          load: ${{ github.event_name == 'pull_request' }}
          provenance: ${{ github.event_name != 'pull_request' }}
          sbom: ${{ github.event_name != 'pull_request' }}

      - name: Smoke test Hermes image
        if: matrix.name == 'grotto-hermes' && github.event_name == 'pull_request'
        shell: bash
        env:
          GROTTO_HERMES_IMAGE: ${{ matrix.image }}:sha-${{ github.sha }}
        run: CONTAINER_ENGINE=docker make smoke-hermes

      - name: Build and publish desktop image
        id: desktop-build
        if: matrix.kind == 'desktop'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            ${{ matrix.build_args }}
            GROTTO_BUILD_REVISION=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=min,scope=${{ matrix.name }}
          provenance: ${{ github.event_name != 'pull_request' }}
          sbom: ${{ github.event_name != 'pull_request' }}

      - name: Select desktop image under test
        id: desktop-image
        if: matrix.kind == 'desktop'
        shell: bash
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          if [[ '${{ github.event_name }}' == pull_request ]]; then
            image="$(head -n 1 <<< "$IMAGE_TAGS")"
          else
            image='${{ matrix.image }}@${{ steps.desktop-build.outputs.digest }}'
            docker pull "$image"
          fi
          printf 'image=%s\n' "$image" >> "$GITHUB_OUTPUT"

      - name: Build and publish worker image
        if: matrix.kind == 'worker'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
          provenance: ${{ github.event_name != 'pull_request' }}
          sbom: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}

      # The Containerfile already fails the build if the pinned OpenAdapt
      # release no longer exposes the private surface the adapter composes
      # around. This runs the same canary against the finished image so the
      # report is visible in the log rather than only in a build failure.
      - name: Smoke test worker runtime
        if: matrix.kind == 'worker' && github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          tag="$(printf '%s' '${{ steps.meta.outputs.tags }}' | head -n1)"
          docker run --rm --network none "${tag}" canary
          docker run --rm --network none "${tag}" --help >/dev/null
          test "$(docker run --rm --network none --entrypoint id "${tag}" -u)" = 10001

      - name: Smoke test ChatGPT desktop runtime
        if: matrix.name == 'grotto-chatgpt-desktop'
        shell: bash
        env:
          IMAGE_UNDER_TEST: ${{ steps.desktop-image.outputs.image }}
        run: |
          set -Eeuo pipefail
          name=grotto-chatgpt-desktop-smoke-${GITHUB_RUN_ID}
          volume=${name}-config
          cleanup() {
            docker rm -f "$name" >/dev/null 2>&1 || true
            docker volume rm -f "$volume" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          docker volume create "$volume" >/dev/null
          docker run --rm --entrypoint sh --volume "$volume:/config" \
            "$IMAGE_UNDER_TEST" -c \
            'mkdir -p /config/.codex; printf preserved > /config/chatgpt-volume-sentinel'
          docker run -d \
            --name "$name" \
            --shm-size=2g \
            --env HOME=/config \
            --env CODEX_HOME=/config/.codex \
            --volume "$volume:/config" \
            "$IMAGE_UNDER_TEST" >/dev/null
          ready=false
          for _ in $(seq 1 180); do
            if docker exec "$name" pgrep -x labwc >/dev/null 2>&1 \
                && docker exec "$name" pgrep -f '[c]hatgpt' >/dev/null 2>&1; then
              ready=true
              break
            fi
            sleep 1
          done
          test "$ready" = true
          docker exec --user abc "$name" /usr/local/libexec/grotto-chatgpt-desktop-smoke
          test "$(docker exec "$name" cat /config/chatgpt-volume-sentinel)" = preserved
          # The inner shell expands socket; the workflow shell must not.
          # shellcheck disable=SC2016
          wayland_inventory="$(
            docker exec --user abc --env XDG_RUNTIME_DIR=/config/.XDG "$name" sh -c '
              for socket in /config/.XDG/wayland-*; do
                [ -S "$socket" ] || continue
                WAYLAND_DISPLAY="${socket##*/}" wlrctl toplevel list 2>/dev/null || true
              done
            '
          )"
          x11_inventory="$(
            docker exec --user abc --env DISPLAY=:0 "$name" \
              xlsclients -display :0 -l 2>/dev/null || true
          )"
          if ! grep -qi chatgpt <<< "$wayland_inventory"; then
            echo "ChatGPT did not expose a native Wayland toplevel" >&2
            printf 'Wayland inventory:\n%s\nX11 inventory:\n%s\n' \
              "$wayland_inventory" "$x11_inventory" >&2
            exit 1
          fi
          if grep -qi chatgpt <<< "$x11_inventory"; then
            echo "ChatGPT is visible only through X11/XWayland or duplicated there" >&2
            exit 1
          fi

      - name: Smoke test Hermes desktop runtime
        if: matrix.name == 'grotto-hermes-desktop'
        shell: bash
        env:
          IMAGE_UNDER_TEST: ${{ steps.desktop-image.outputs.image }}
        run: |
          set -euo pipefail
          CONTAINER_ENGINE=docker GROTTO_HERMES_DESKTOP_IMAGE="$IMAGE_UNDER_TEST" \
            tests/smoke-hermes-desktop.sh
