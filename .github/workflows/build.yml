name: Build Grotto

on:
  schedule:
    # GitHub Actions cron is UTC.
    - cron: '17 11 * * *'

  push:
    branches:
      - main
    tags:
      - "v*"

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: build-grotto-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  checks:
    name: Static policy checks
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Run repository checks
        run: make check

      - name: Run focused Python tests
        run: |
          python3 tests/test_grotto_doctor.py
          python3 tests/test_verify_installed_chatgpt_policy.py

      - name: Install ShellCheck
        if: github.event_name == 'pull_request'
        run: sudo apt-get update && sudo apt-get install --yes shellcheck

      - name: Shellcheck changed shell files
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          mapfile -t shell_files < <(
            git diff --name-only --diff-filter=ACMRT "$BASE_SHA...$HEAD_SHA" -- '*.sh'
          )
          if (( ${#shell_files[@]} > 0 )); then
            shellcheck "${shell_files[@]}"
          fi

      - name: Check diff whitespace
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: git diff --check "$BASE_SHA...$HEAD_SHA"

  image:
    name: Build ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: grotto-openclaw
            kind: agent
            image: ghcr.io/pelagians/grotto-openclaw
            title: Grotto OpenClaw
            description: General OpenClaw gateway with curated baseline tools and persistent user-installed toolchains
            file: ./Containerfile
          - name: grotto-hermes
            kind: agent
            image: ghcr.io/pelagians/grotto-hermes
            title: Grotto Hermes
            description: Official Hermes Agent with persistent Grotto tool environments
            file: ./Containerfile.hermes
          - name: grotto-chatgpt-desktop
            kind: desktop
            image: ghcr.io/pelagians/grotto-chatgpt-desktop
            title: Grotto ChatGPT Desktop
            description: Selkies-streamed ChatGPT and Codex desktop workbench
            file: ./Containerfile.chatgpt-desktop
            build_args: CHATGPT_PACKAGE_VERSION=26.820.60940
          - name: grotto-hermes-desktop
            kind: desktop
            image: ghcr.io/pelagians/grotto-hermes-desktop
            title: Grotto Hermes Desktop
            description: Official Hermes Desktop on the Pelagian Shell streamed workspace
            file: ./Containerfile.hermes-desktop
            build_args: |
              HERMES_DESKTOP_VERSION=v2026.8.27
              HERMES_DESKTOP_COMMIT=5fc308a70719a83cccdbba4c0e39c23f5a8239d5
          - name: grotto-openadapt-teach
            kind: worker
            image: ghcr.io/pelagians/grotto-openadapt-teach
            title: Grotto OpenAdapt Teach worker
            description: UI-only OpenAdapt recording and compilation worker for caller-owned browser runtimes
            file: ./Containerfile.openadapt-teach

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Reclaim runner disk space
        if: matrix.kind == 'desktop'
        shell: bash
        run: |
          set -euxo pipefail
          df -h /
          sudo rm -rf \
            /usr/local/lib/android \
            /usr/share/dotnet \
            /opt/ghc \
            /opt/hostedtoolcache/CodeQL
          sudo docker system prune --all --force --volumes || true
          available_kib="$(df --output=avail -k / | tail -n 1)"
          minimum_kib="$((15 * 1024 * 1024))"
          if (( available_kib < minimum_kib )); then
            echo "At least 15 GiB of free runner storage is required." >&2
            df -h /
            exit 1
          fi
          df -h /

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        env:
          DOCKER_METADATA_SHORT_SHA_LENGTH: 40
        with:
          images: ${{ matrix.image }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.title=${{ matrix.title }}
            org.opencontainers.image.description=${{ matrix.description }}
            org.opencontainers.image.source=https://github.com/pelagians/grotto

      - name: Build and publish agent image
        if: matrix.kind == 'agent'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GROTTO_BUILD_REVISION=${{ github.event.pull_request.head.sha || github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
          load: ${{ github.event_name == 'pull_request' }}
          provenance: ${{ github.event_name != 'pull_request' }}
          sbom: ${{ github.event_name != 'pull_request' }}

      - name: Smoke test Hermes image
        if: matrix.name == 'grotto-hermes' && github.event_name == 'pull_request'
        shell: bash
        env:
          GROTTO_HERMES_IMAGE: ${{ matrix.image }}:sha-${{ github.sha }}
        run: CONTAINER_ENGINE=docker make smoke-hermes

      - name: Build and publish desktop image
        id: desktop-build
        if: matrix.kind == 'desktop'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            ${{ matrix.build_args }}
            GROTTO_BUILD_REVISION=${{ github.event.pull_request.head.sha || github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=min,scope=${{ matrix.name }}
          provenance: ${{ github.event_name != 'pull_request' }}
          sbom: ${{ github.event_name != 'pull_request' }}

      - name: Select desktop image under test
        id: desktop-image
        if: matrix.kind == 'desktop'
        shell: bash
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          if [[ '${{ github.event_name }}' == pull_request ]]; then
            image="$(head -n 1 <<< "$IMAGE_TAGS")"
          else
            image='${{ matrix.image }}@${{ steps.desktop-build.outputs.digest }}'
            docker pull "$image"
          fi
          printf 'image=%s\n' "$image" >> "$GITHUB_OUTPUT"

      - name: Build and publish worker image
        if: matrix.kind == 'worker'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
          provenance: ${{ github.event_name != 'pull_request' }}
          sbom: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}

      # The Containerfile already fails the build if the pinned OpenAdapt
      # release no longer exposes the private surface the adapter composes
      # around. This runs the same canary against the finished image so the
      # report is visible in the log rather than only in a build failure.
      - name: Smoke test worker runtime
        if: matrix.kind == 'worker' && github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          tag="$(printf '%s' '${{ steps.meta.outputs.tags }}' | head -n1)"
          docker run --rm --network none "${tag}" canary
          docker run --rm --network none "${tag}" --help >/dev/null
          test "$(docker run --rm --network none --entrypoint id "${tag}" -u)" = 10001

      - name: Probe ChatGPT Docker compatibility
        if: matrix.name == 'grotto-chatgpt-desktop'
        env:
          IMAGE_UNDER_TEST: ${{ steps.desktop-image.outputs.image }}
        shell: bash
        run: |
          set -euo pipefail
          log="$(mktemp)"
          trap 'rm -f "$log"' EXIT
          if CONTAINER_ENGINE=docker GROTTO_CHATGPT_DESKTOP_IMAGE="$IMAGE_UNDER_TEST" \
              tests/smoke-chatgpt-desktop.sh 2>&1 | tee "$log"; then
            echo 'ChatGPT Docker runtime: passed.' >> "$GITHUB_STEP_SUMMARY"
          elif grep -Eq 'FATAL:content/browser/zygote_host/zygote_host_impl_linux\.cc:[0-9]+\] No usable sandbox!' "$log"; then
            echo '::warning::ChatGPT is not qualified under default Docker: Chromium cannot create its sandbox. Rootless Podman remains the required runtime gate.'
            echo 'ChatGPT Docker runtime: unsupported on this runner (Chromium namespace sandbox denied). The rootless Podman runtime check remains required.' >> "$GITHUB_STEP_SUMMARY"
          else
            exit 1
          fi

      - name: Smoke test Hermes desktop runtime
        if: matrix.name == 'grotto-hermes-desktop'
        env:
          IMAGE_UNDER_TEST: ${{ steps.desktop-image.outputs.image }}
        run: CONTAINER_ENGINE=docker GROTTO_HERMES_DESKTOP_IMAGE="$IMAGE_UNDER_TEST" tests/smoke-hermes-desktop.sh

      - name: Smoke desktop with rootless Podman
        if: ${{ !cancelled() && matrix.kind == 'desktop' && steps.desktop-image.outcome == 'success' }}
        env:
          IMAGE_UNDER_TEST: ${{ steps.desktop-image.outputs.image }}
          DESKTOP: ${{ matrix.name }}
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes podman uidmap slirp4netns fuse-overlayfs
          test "$(podman info --format '{{.Host.Security.Rootless}}')" = true
          # Import precisely the image already exercised with Docker.
          podman_tag="localhost/grotto-smoke:${GITHUB_RUN_ID}"
          docker tag "$IMAGE_UNDER_TEST" "$podman_tag"
          docker save "$podman_tag" | podman load
          kind="${DESKTOP#grotto-}"
          CONTAINER_ENGINE=podman tests/smoke-desktop.sh "${kind%-desktop}" "$podman_tag"
