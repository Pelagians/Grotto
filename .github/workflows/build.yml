name: Build Grotto

on:
  schedule:
    # GitHub Actions cron is UTC.
    - cron: '17 11 * * *'

  push:
    branches:
      - main
    tags:
      - "v*"

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: build-grotto-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  checks:
    name: Static policy checks
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Run repository checks
        run: make check

      - name: Install ShellCheck
        if: github.event_name == 'pull_request'
        run: sudo apt-get update && sudo apt-get install --yes shellcheck

      - name: Shellcheck changed shell files
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          mapfile -t shell_files < <(
            git diff --name-only --diff-filter=ACMRT "$BASE_SHA...$HEAD_SHA" -- '*.sh'
          )
          if (( ${#shell_files[@]} > 0 )); then
            shellcheck "${shell_files[@]}"
          fi

      - name: Check diff whitespace
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: git diff --check "$BASE_SHA...$HEAD_SHA"

  select:
    name: Select affected images
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      any: ${{ steps.matrix.outputs.any }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Select matrix
        id: matrix
        env:
          EVENT: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          base=''
          if [[ "$EVENT" == pull_request ]]; then
            base="$PR_BASE"
          elif [[ "$EVENT" == push && "$REF_TYPE" == branch ]]; then
            base="$PUSH_BASE"
          fi
          matrix="$(python3 tests/ci_matrix.py --base "$base")"
          printf 'matrix=%s\n' "$matrix" >> "$GITHUB_OUTPUT"
          if [[ "$matrix" == '{"include":[]}' ]]; then
            echo 'any=false' >> "$GITHUB_OUTPUT"
          else
            echo 'any=true' >> "$GITHUB_OUTPUT"
          fi

  image:
    name: Build ${{ matrix.name }}
    needs: [checks, select]
    if: needs.select.outputs.any == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.select.outputs.matrix) }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Reclaim runner disk space
        if: matrix.kind == 'desktop'
        shell: bash
        run: |
          set -euxo pipefail
          df -h /
          sudo rm -rf \
            /usr/local/lib/android \
            /usr/share/dotnet \
            /opt/ghc \
            /opt/hostedtoolcache/CodeQL
          sudo docker system prune --all --force --volumes || true
          available_kib="$(df --output=avail -k / | tail -n 1)"
          minimum_kib="$((15 * 1024 * 1024))"
          if (( available_kib < minimum_kib )); then
            echo "At least 15 GiB of free runner storage is required." >&2
            df -h /
            exit 1
          fi
          df -h /

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        env:
          DOCKER_METADATA_SHORT_SHA_LENGTH: 40
        with:
          images: ${{ matrix.image }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.title=${{ matrix.title }}
            org.opencontainers.image.description=${{ matrix.description }}
            org.opencontainers.image.source=https://github.com/pelagians/grotto

      # Published aliases are set only after runtime qualification. On push,
      # Buildx first publishes an immutable run-specific candidate with its
      # provenance and SBOM; all smokes pull and exercise that exact digest.
      - name: Build candidate image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          platforms: linux/amd64
          push: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
          load: ${{ github.event_name == 'pull_request' || github.event_name == 'schedule' }}
          tags: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && format('{0}:candidate-{1}-{2}', matrix.image, github.run_id, github.run_attempt) || steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            ${{ matrix.build_args }}
            GROTTO_BUILD_REVISION=${{ github.event.pull_request.head.sha || github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=${{ matrix.kind == 'desktop' && 'min' || 'max' }},scope=${{ matrix.name }}
          provenance: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
          sbom: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}

      - name: Select exact image under test
        id: image
        shell: bash
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          if [[ '${{ github.event_name }}' == pull_request || '${{ github.event_name }}' == schedule ]]; then
            image="$(head -n 1 <<< "$IMAGE_TAGS")"
          else
            image='${{ matrix.image }}@${{ steps.build.outputs.digest }}'
            docker pull "$image"
          fi
          printf 'image=%s\n' "$image" >> "$GITHUB_OUTPUT"

      - name: Smoke Hermes agent
        if: matrix.name == 'grotto-hermes'
        env:
          GROTTO_HERMES_IMAGE: ${{ steps.image.outputs.image }}
        run: CONTAINER_ENGINE=docker make smoke-hermes

      - name: Smoke OpenClaw image
        if: matrix.name == 'grotto-openclaw'
        env:
          IMAGE_UNDER_TEST: ${{ steps.image.outputs.image }}
        run: docker run --rm --network none --entrypoint sh "$IMAGE_UNDER_TEST" -c 'command -v openclaw && test -x /usr/local/bin/grotto-openclaw-entrypoint'

      # The Containerfile already fails the build if the pinned OpenAdapt
      # release no longer exposes the private surface the adapter composes
      # around. This runs the same canary against the finished image so the
      # report is visible in the log rather than only in a build failure.
      - name: Smoke test worker runtime
        if: matrix.kind == 'worker'
        shell: bash
        env:
          IMAGE_UNDER_TEST: ${{ steps.image.outputs.image }}
        run: |
          set -euo pipefail
          docker run --rm --network none "$IMAGE_UNDER_TEST" canary
          docker run --rm --network none "$IMAGE_UNDER_TEST" --help >/dev/null
          test "$(docker run --rm --network none --entrypoint id "$IMAGE_UNDER_TEST" -u)" = 10001

      - name: Probe ChatGPT Docker compatibility
        if: matrix.name == 'grotto-chatgpt-desktop'
        env:
          IMAGE_UNDER_TEST: ${{ steps.image.outputs.image }}
        shell: bash
        run: |
          set -euo pipefail
          log="$(mktemp)"
          trap 'rm -f "$log"' EXIT
          if CONTAINER_ENGINE=docker GROTTO_CHATGPT_DESKTOP_IMAGE="$IMAGE_UNDER_TEST" \
              tests/smoke-chatgpt-desktop.sh 2>&1 | tee "$log"; then
            echo 'ChatGPT Docker runtime: passed.' >> "$GITHUB_STEP_SUMMARY"
          elif grep -Eq 'FATAL:content/browser/zygote_host/zygote_host_impl_linux\.cc:[0-9]+\] No usable sandbox!' "$log"; then
            echo '::warning::ChatGPT is not qualified under default Docker: Chromium cannot create its sandbox. Rootless Podman remains the required runtime gate.'
            echo 'ChatGPT Docker runtime: unsupported on this runner (Chromium namespace sandbox denied). The rootless Podman runtime check remains required.' >> "$GITHUB_STEP_SUMMARY"
          else
            exit 1
          fi

      - name: Smoke test Hermes desktop runtime
        if: matrix.name == 'grotto-hermes-desktop'
        env:
          IMAGE_UNDER_TEST: ${{ steps.image.outputs.image }}
        run: CONTAINER_ENGINE=docker GROTTO_HERMES_DESKTOP_IMAGE="$IMAGE_UNDER_TEST" tests/smoke-hermes-desktop.sh

      - name: Smoke desktop with rootless Podman
        if: ${{ !cancelled() && matrix.kind == 'desktop' && steps.image.outcome == 'success' }}
        env:
          IMAGE_UNDER_TEST: ${{ steps.image.outputs.image }}
          DESKTOP: ${{ matrix.name }}
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes podman uidmap slirp4netns fuse-overlayfs
          test "$(podman info --format '{{.Host.Security.Rootless}}')" = true
          # Import precisely the image already exercised with Docker.
          podman_tag="localhost/grotto-smoke:${GITHUB_RUN_ID}"
          docker tag "$IMAGE_UNDER_TEST" "$podman_tag"
          docker save "$podman_tag" | podman load
          kind="${DESKTOP#grotto-}"
          CONTAINER_ENGINE=podman tests/smoke-desktop.sh "${kind%-desktop}" "$podman_tag"

      - name: Promote qualified digest to release tags
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          IMAGE_UNDER_TEST: ${{ steps.image.outputs.image }}
          RELEASE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          tags=()
          while IFS= read -r tag; do
            [[ -z "$tag" ]] || tags+=(--tag "$tag")
          done <<< "$RELEASE_TAGS"
          test "${#tags[@]}" -gt 0
          docker buildx imagetools create "${tags[@]}" "$IMAGE_UNDER_TEST"
          while IFS= read -r tag; do
            [[ -z "$tag" ]] || docker buildx imagetools inspect "$tag" >/dev/null
          done <<< "$RELEASE_TAGS"
